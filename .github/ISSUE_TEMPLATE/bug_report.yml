name: "Bug report"
description: "Create a report to help us improve"
title: "[BUG] Server GUI crash when ..."
labels: "bug"
assignees: 'mkckr0'
body:
  - type: markdown
    attributes:
      value: "# Bug details"
  - type: textarea
    attributes:
      label: "Describe the bug"
      placeholder: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    attributes:
      label: "What steps will reproduce the bug?"
      placeholder: |
        Steps to reproduce the behavior:
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    attributes:
      label: "What is the expected behavior?"
      placeholder: "A clear and concise description of what you expected to happen."
  - type: textarea
    attributes:
      label: "Screenshots"
      placeholder: "If applicable, add screenshots to help explain your problem."
    validations:
      required: true
  - type: markdown
    attributes:
      value: "# Server"
  - type: input
    attributes:
      label: "Host OS:"
      placeholder: "e.g. Windows 10 22H2 19045.3570"
    validations:
      required: true
  - type: input
    attributes:
      label: "GUI or CMD:"
      placeholder: "e.g. GUI"
    validations:
      required: true
  - type: input
    attributes:
      label: "Version on host:"
      placeholder: "e.g. v0.3.4"
    validations:
      required: true
  - type: markdown
    attributes:
      value: "# Android"
  - type: input
    attributes:
      label: "Device:"
      placeholder: "e.g. Redmi K50"
    validations:
      required: true
  - type: input
    attributes:
      label: "Device OS:"
      placeholder: "e.g. Android 13"
    validations:
      required: true
  - type: input
    attributes:
      label: "Version on device:"
      placeholder: "e.g. v0.3.4"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Additional information"
      placeholder: "Add any other information about the problem here, such as server.log or stdout."
