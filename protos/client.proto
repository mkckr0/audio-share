syntax = "proto3";

package io.github.mkckr0.audio_share_app.pb;

message AudioFormat
{
   enum Encoding {
      ENCODING_INVALID = 0;
      ENCODING_PCM_FLOAT = 1;   // PCM encoding are all little endian
      ENCODING_PCM_8BIT = 2;
      ENCODING_PCM_16BIT = 3;
      ENCODING_PCM_24BIT = 4;
      ENCODING_PCM_32BIT = 5;
   }

	enum Compression {
		COMPRESSION_NONE = 0;   // Audio data is raw PCM described by `encoding`.
		COMPRESSION_OPUS = 1;   // Datagram = uint16 LE sequence + one 20 ms Opus packet, decoded to 16-bit PCM (V2 clients only).
	}

	Encoding encoding = 1;
	int32 channels = 2;
	int32 sample_rate = 3;
	Compression compression = 4;   // Absent (0) from servers that don't support compression.
	int32 opus_pre_skip = 5;       // samples at 48 kHz to discard at stream start
}
